<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <title>Регистрация</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 400px;
            margin: 60px auto;
            padding: 0 16px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }

        /* aria-invalid — семантический атрибут, не просто класс.
           Playwright может искать по нему: page.locator('[aria-invalid="true"]')
           Плюс скринридеры его понимают — доступность бесплатно. */
        input[aria-invalid="true"] {
            border-color: red;
            outline-color: red;
        }

        .error {
            color: red;
            font-size: 12px;
            margin-top: 4px;
        }

        /* Сетевая ошибка — отдельный блок вверху формы.
           Не привязана к полю — это инфраструктурная проблема. */
        .network-error {
            background: #fee;
            border: 1px solid red;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 16px;
            color: red;
        }

        button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .success {
            color: green;
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>Регистрация</h1>

    <!-- role="alert" — браузер объявит содержимое скринридеру
         как только оно появится. Playwright тоже умеет
         ждать role="alert": page.getByRole('alert') -->
    <div id="network-error" class="network-error" role="alert" hidden></div>

    <form id="register-form" novalidate>
        <!-- novalidate — отключаем браузерную валидацию.
             Иначе браузер покажет свои тултипы раньше нашего JS,
             и тесты будут ловить нативный UI вместо нашего. -->

        <div class="field">
            <label for="nickname">Никнейм</label>
            <input id="nickname" name="nickname" type="text" autocomplete="username"
                placeholder="от 3 до 20 символов, a-z 0-9 _" />
            <!-- Соглашение: id ошибки = ${fieldId}-error
                 JS ищет по этому паттерну в showError() / clearError() -->
            <div id="nickname-error" class="error" role="alert" hidden></div>
        </div>

        <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="user@example.com" />
            <div id="email-error" class="error" role="alert" hidden></div>
        </div>

        <div class="field">
            <label for="password">Пароль</label>
            <input id="password" name="password" type="password" autocomplete="new-password"
                placeholder="мин. 8 символов, цифра, заглавная" />
            <div id="password-error" class="error" role="alert" hidden></div>
        </div>

        <button id="submit-btn" type="submit">
            Зарегистрироваться
        </button>
    </form>
    <button id="test-btn1">Test1</button>

    <p id="success-message" class="success" hidden>
        ✅ Регистрация прошла успешно!
    </p>

    <script src="./playground-main.js"></script>
</body>

</html>
